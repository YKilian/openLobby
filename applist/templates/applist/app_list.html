{% extends "base.html" %}
{% load static %}

{% block title %}Applist{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-white mb-4">Verfügbare Anwendungen</h2>

    <div class="row g-4">
        {% for app in installed_apps %}
        <div class="col-md-4 col-sm-6"> <div class="card h-100 text-center shadow-sm">
                <div class="py-4 bg-light border-bottom">
                    <i class="bi {{ app.icon }} text-primary" style="font-size: 4rem;"></i>
                </div>

                <div class="card-body d-flex flex-column">
                    <h5 class="card-title fw-bold">{{ app.display_name }}</h5>
                    <p class="card-text text-muted small flex-grow-1">
                        {{ app.description }}
                    </p>
                    <a href="{% url app.url_name %}" class="btn btn-primary w-100 mt-3">
                        Go to
                    </a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
